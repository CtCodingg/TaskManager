name: Release Build

# Runs for every pushed tag (e.g. "v1.0.0"). Also runnable manually from the
# Actions tab (workflow_dispatch) for testing without needing to push a tag.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Needed so the workflow can create/attach files to a GitHub Release.
permissions:
  contents: write

env:
  BUILD_TYPE: Release

jobs:
  # ---------------------------------------------------------------------
  # Windows x64 (MSVC, statically-linked CRT -- see CMakeLists.txt, no
  # extra runtime DLLs to bundle).
  # ---------------------------------------------------------------------
  windows-x64:
    name: Windows x64
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      # Speeds up repeat runs: GLFW/Dear ImGui/ImPlot are re-downloaded via
      # FetchContent every configure unless cached here.
      - name: Cache FetchContent dependencies
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: ${{ runner.os }}-${{ runner.arch }}-fetchcontent-${{ hashFiles('CMakeLists.txt') }}

      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}

      - name: Build
        run: cmake --build build --config ${{ env.BUILD_TYPE }} --parallel

      - name: Install
        run: cmake --install build --config ${{ env.BUILD_TYPE }} --prefix install

      # 7z ships preinstalled on the windows-2022 runner image.
      - name: Package
        shell: bash
        run: |
          cd install
          7z a "../CtTaskManager-${{ github.ref_name }}-windows-x64.zip" .

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: CtTaskManager-windows-x64
          path: CtTaskManager-${{ github.ref_name }}-windows-x64.zip

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: CtTaskManager-${{ github.ref_name }}-windows-x64.zip

  # ---------------------------------------------------------------------
  # Ubuntu 22.04 x64 (GCC, statically-linked libstdc++/libgcc -- see
  # CMakeLists.txt; glibc/OpenGL/X11 remain dynamic system libraries, as
  # on every Linux desktop).
  # ---------------------------------------------------------------------
  ubuntu22-x64:
    name: Ubuntu 22.04 x64
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      # xorg-dev pulls the X11 headers GLFW's Linux backend needs
      # (Xrandr, Xinerama, Xcursor, Xi, ...); libgl1-mesa-dev is the
      # OpenGL headers/loader dev package.
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build \
            libgl1-mesa-dev xorg-dev

      - name: Cache FetchContent dependencies
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: ${{ runner.os }}-${{ runner.arch }}-fetchcontent-${{ hashFiles('CMakeLists.txt') }}

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}

      - name: Build
        run: cmake --build build --parallel

      - name: Install
        run: cmake --install build --prefix install

      - name: Package
        run: |
          cd install
          tar -czf "../CtTaskManager-${{ github.ref_name }}-ubuntu22-x64.tar.gz" .

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: CtTaskManager-ubuntu22-x64
          path: CtTaskManager-${{ github.ref_name }}-ubuntu22-x64.tar.gz

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: CtTaskManager-${{ github.ref_name }}-ubuntu22-x64.tar.gz

  # ---------------------------------------------------------------------
  # Ubuntu 22.04 ARMv8 (aarch64) -- native GitHub-hosted Arm64 runner
  # (label "ubuntu-22.04-arm", GA since Aug 2025). Covers ARM single-board
  # computers and, notably, NVIDIA Jetson (see CMakeLists.txt's
  # TM_IS_JETSON detection). Same statically-linked libstdc++/libgcc
  # approach as the x64 job.
  # ---------------------------------------------------------------------
  ubuntu22-arm64:
    name: Ubuntu 22.04 ARMv8
    runs-on: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build \
            libgl1-mesa-dev xorg-dev

      - name: Cache FetchContent dependencies
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: ${{ runner.os }}-${{ runner.arch }}-fetchcontent-${{ hashFiles('CMakeLists.txt') }}

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}

      - name: Build
        run: cmake --build build --parallel

      - name: Install
        run: cmake --install build --prefix install

      - name: Package
        run: |
          cd install
          tar -czf "../CtTaskManager-${{ github.ref_name }}-ubuntu22-arm64.tar.gz" .

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: CtTaskManager-ubuntu22-arm64
          path: CtTaskManager-${{ github.ref_name }}-ubuntu22-arm64.tar.gz

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: CtTaskManager-${{ github.ref_name }}-ubuntu22-arm64.tar.gz
